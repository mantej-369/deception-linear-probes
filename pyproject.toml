[project]
name = "deception-linear-probes"
version = "0.1.0"
description = "Confound-audited linear probing pipeline for detecting deceptive intent in open-weight LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "transformer-lens>=2.0.0",
    "datasets>=2.20.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]